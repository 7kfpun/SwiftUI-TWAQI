name: Workers

# Cloudflare Workers under workers/<name>/. Each folder is its own npm package
# with its own wrangler config. Pull requests typecheck and dry-run the Workers
# they change; a merge to master deploys only the Workers it changed.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, plus every
# name a Worker lists in its wrangler config under secrets.required. Those are
# uploaded with each deploy, so a new or recreated Worker works straight away.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths: ["workers/**"]
  push:
    # TEMPORARY: feature/twaqi-station-cams-worker deploys before merge so the
    # first GitHub deploy can be checked. Remove it here and in the deploy job.
    branches: [master, feature/twaqi-station-cams-worker]
    paths: ["workers/**"]
  workflow_dispatch:
    inputs:
      worker:
        description: Folder under workers/ to deploy, or "all"
        required: true
        default: all

permissions:
  contents: read

jobs:
  changes:
    name: Find changed Workers
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.list.outputs.workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List Worker folders
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_WORKER: ${{ inputs.worker }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          all() { find workers -mindepth 2 -maxdepth 2 -name package.json | cut -d/ -f2; }
          case "$EVENT" in
            workflow_dispatch)
              if [ "$INPUT_WORKER" = all ]; then
                names="$(all)"
              else
                names="$INPUT_WORKER"
              fi
              ;;
            pull_request)
              names="$(git diff --name-only "$PR_BASE...$PR_HEAD" -- workers/ | cut -d/ -f2)"
              ;;
            push)
              # A first push or a force push may leave no usable base. Deploy
              # everything rather than silently skipping a changed Worker.
              if [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ] \
                || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                names="$(all)"
              else
                names="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" -- workers/ | cut -d/ -f2)"
              fi
              ;;
          esac
          # Keep folders that still exist as packages; a deleted Worker has
          # nothing to deploy.
          workers="$(
            printf '%s\n' $names | sort -u | while read -r name; do
              [ -n "$name" ] && [ -f "workers/$name/package.json" ] && echo "$name"
            done | jq -R . | jq -cs .
          )"
          echo "Workers: $workers"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"

  check:
    name: Check ${{ matrix.worker }}
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.workers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build without deploying
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/feature/twaqi-station-cams-worker') &&
      needs.changes.outputs.workers != '[]'
    runs-on: ubuntu-latest
    # Never cancel a deploy halfway; queue the next one behind it.
    concurrency:
      group: workers-deploy-${{ matrix.worker }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Collect Worker secrets
        env:
          REPO_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          # Copy only the names this Worker lists under secrets.required, and
          # fail if any is missing rather than deploying a Worker that can't run.
          node - "$RUNNER_TEMP/worker-secrets.json" <<'JS'
          const fs = require('fs')
          const out = process.argv[2]
          const file = ['wrangler.jsonc', 'wrangler.json'].find((f) => fs.existsSync(f))
          if (!file) throw new Error('No wrangler.jsonc or wrangler.json')
          // Drop JSONC comments and trailing commas, leaving string contents alone.
          const text = fs.readFileSync(file, 'utf8')
            .replace(/("(?:\\.|[^"\\])*")|\/\/[^\n]*|\/\*[\s\S]*?\*\//g, (m, str) => str ?? '')
            .replace(/("(?:\\.|[^"\\])*")|,(\s*[}\]])/g, (m, str, end) => str ?? end)
          const required = JSON.parse(text).secrets?.required ?? []
          const all = JSON.parse(process.env.REPO_SECRETS)
          const missing = required.filter((name) => !all[name])
          if (missing.length) {
            console.error(`Missing repository secrets: ${missing.join(', ')}`)
            process.exit(1)
          }
          fs.writeFileSync(out, JSON.stringify(Object.fromEntries(required.map((n) => [n, all[n]]))), { mode: 0o600 })
          console.log(`Secrets to upload: ${required.join(', ') || '(none)'}`)
          JS

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker-secrets.json"

      - name: Remove secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/worker-secrets.json"
