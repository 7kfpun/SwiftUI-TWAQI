name: Workers

# Cloudflare Workers under workers/<name>/. Each folder is its own npm package
# with its own wrangler config. Pull requests typecheck and dry-run the Workers
# they change; a merge to master deploys only the Workers it changed.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Runtime secrets (MOENV_API_KEY, SYNC_TOKEN, ...) stay on each Worker in
# Cloudflare and are kept across deploys.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]
    paths: ["workers/**"]
  push:
    branches: [master]
    paths: ["workers/**"]
  workflow_dispatch:
    inputs:
      worker:
        description: Folder under workers/ to deploy, or "all"
        required: true
        default: all

permissions:
  contents: read

jobs:
  changes:
    name: Find changed Workers
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      workers: ${{ steps.list.outputs.workers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List Worker folders
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_WORKER: ${{ inputs.worker }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          all() { find workers -mindepth 2 -maxdepth 2 -name package.json | cut -d/ -f2; }
          case "$EVENT" in
            workflow_dispatch)
              if [ "$INPUT_WORKER" = all ]; then
                names="$(all)"
              else
                names="$INPUT_WORKER"
              fi
              ;;
            pull_request)
              names="$(git diff --name-only "$PR_BASE...$PR_HEAD" -- workers/ | cut -d/ -f2)"
              ;;
            push)
              # A first push or a force push may leave no usable base. Deploy
              # everything rather than silently skipping a changed Worker.
              if [ "$PUSH_BEFORE" = 0000000000000000000000000000000000000000 ] \
                || ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                names="$(all)"
              else
                names="$(git diff --name-only "$PUSH_BEFORE" "$PUSH_AFTER" -- workers/ | cut -d/ -f2)"
              fi
              ;;
          esac
          # Keep folders that still exist as packages; a deleted Worker has
          # nothing to deploy.
          workers="$(
            printf '%s\n' $names | sort -u | while read -r name; do
              [ -n "$name" ] && [ -f "workers/$name/package.json" ] && echo "$name"
            done | jq -R . | jq -cs .
          )"
          echo "Workers: $workers"
          echo "workers=$workers" >> "$GITHUB_OUTPUT"

  check:
    name: Check ${{ matrix.worker }}
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.workers != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Build without deploying
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/dist"

  deploy:
    name: Deploy ${{ matrix.worker }}
    needs: changes
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/master' &&
      needs.changes.outputs.workers != '[]'
    runs-on: ubuntu-latest
    # Never cancel a deploy halfway; queue the next one behind it.
    concurrency:
      group: workers-deploy-${{ matrix.worker }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.changes.outputs.workers) }}
    defaults:
      run:
        working-directory: workers/${{ matrix.worker }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/${{ matrix.worker }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck --if-present

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
