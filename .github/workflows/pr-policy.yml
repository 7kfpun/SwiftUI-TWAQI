name: PR policy

# Cheap checks for every pull request to master: drafts included, and whatever
# the branch is called, since the branch name is one of the rules. Both jobs
# are meant to be required status checks (docs/master-protection.md).
#
# The gate scripts run from master's copy when master has one, so a pull
# request can't loosen a check in the same change it is checked by.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
    branches: [master, feature/fox-52-android-project-setup]

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  policy:
    name: PR policy
    # Dependabot's branch names and bodies can't follow the ticket rules; it also skips the version checks, which dependency bumps don't touch.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Branch and merge order
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/pr_policy.py"
          git show origin/master:tools/pr_policy.py >"$script" 2>/dev/null || cp tools/pr_policy.py "$script"
          python3 "$script"

      - name: Version, build numbers and What's New
        # master's script, run against the PR's project file, Fastfile and notes.
        # Its argument is the iOS app's directory (ios/, FOX-89).
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/check_release_consistency.py"
          git show origin/master:tools/check_release_consistency.py >"$script" 2>/dev/null \
            || cp tools/check_release_consistency.py "$script"
          python3 "$script" "$PWD/ios"

      - name: Tests for the gate scripts and workflows this PR touches
        # The PR's own copies of the scripts and tests, run only when the diff
        # touches them (the LGTM gate's self-test and the policy tests had no CI run).
        # Unlike the steps above it runs the PR's own scripts: the job has a read-only
        # token and no persisted credentials. The YAML check catches syntax only, not
        # an invalid ${{ }} expression.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          touched() { grep -Eq "$1" <<<"$changed"; }
          if touched '^(tools/(lgtm_gate\.py)|\.github/workflows/lgtm\.yml)$'; then
            python3 tools/lgtm_gate.py --self-test
          fi
          if touched '^(tools/(pr_policy|test_pr_policy|check_release_consistency)\.py|\.github/workflows/pr-policy\.yml)$'; then
            python3 -m unittest discover -s tools -p 'test_pr_policy.py'
          fi
          if touched '^(tools/(public_text_check|test_public_text_check)\.py|\.github/workflows/public-text\.yml)$'; then
            python3 -m unittest discover -s tools -p 'test_public_text_check.py'
          fi
          # Any workflow file must still parse.
          for f in $(grep -E '^\.github/workflows/.*\.ya?ml$' <<<"$changed" || true); do
            [ -f "$f" ] && python3 -c "import sys,yaml;yaml.safe_load(open(sys.argv[1]))" "$f"
          done

  secret-files:
    name: Secret files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: No secret files or values in the diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/check_secret_files.py"
          git show origin/master:tools/check_secret_files.py >"$script" 2>/dev/null || cp tools/check_secret_files.py "$script"
          python3 "$script" "$BASE_SHA" "$HEAD_SHA"
