name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'feature/') &&
      github.base_ref == 'master'
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      COCOAPODS_DISABLE_STATS: "true"
    steps:
      - name: Skip unrelated file changes
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Shallow checkout does not contain the base commit, so use the
          # pull request file list. An empty list or an API error must not
          # skip the tests.
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename' > "$RUNNER_TEMP/pr-files.txt"
          python3 - <<'PY'
          import os
          import pathlib

          files = [
              line.strip()
              for line in pathlib.Path(os.environ["RUNNER_TEMP"], "pr-files.txt").read_text().splitlines()
              if line.strip()
          ]
          # These do not feed TWAQITests. Any other path still runs the job.
          media = {
              ".m4a", ".mp3", ".wav", ".aac", ".caf", ".aiff", ".aif", ".m4b", ".flac", ".ogg",
              ".mp4", ".mov", ".m4v", ".avi", ".webm",
              ".png", ".jpg", ".jpeg", ".gif", ".webp", ".heic", ".svg", ".pdf",
          }
          docs = {".md", ".markdown"}
          # workers/ is checked by the Workers workflow.
          prefixes = ("assets/", "fastlane/", "web/", "workers/")

          def unrelated(path):
              normalized = path.replace("\\", "/").lower()
              if normalized.startswith(prefixes):
                  return True
              suffix = pathlib.PurePosixPath(normalized).suffix
              return suffix in media or suffix in docs

          if not files:
              print("No changed files were listed. Running unit tests.")
              decision = "true"
          else:
              related = [path for path in files if not unrelated(path)]
              if related:
                  print("Running unit tests. Related files:")
                  print("\n".join(f"  {path}" for path in related))
                  decision = "true"
              else:
                  print("Skipping unit tests. Changed files are media, docs, marketing, or Workers:")
                  print("\n".join(f"  {path}" for path in files))
                  decision = "false"
          with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a") as handle:
              handle.write(f"run={decision}\n")
          PY

      - name: Checkout repository
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Show Xcode
        if: steps.scope.outputs.run == 'true'
        run: xcodebuild -version

      - name: Prepare gitignored config
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          # The project will not build without these, and they are gitignored
          # because they hold local API keys. Example values are enough to
          # compile and launch the host app for unit tests.
          cp TWAQI/Config/example.xcconfig TWAQI/Config/debug.xcconfig
          cp TWAQI/Config/example.xcconfig TWAQI/Config/release.xcconfig
          # example.xcconfig sets GMSServicesApiKey to an empty value
          # (`= // Required` is a comment). An empty key skips meaningful
          # GMSServices.provideAPIKey, and creating GMSMapView then crashes
          # the test host with GMSServicesException.
          python3 - <<'PY'
          from pathlib import Path
          key_line = "GMSServicesApiKey = AIzaSyCIPlaceholderKeyForUnitTests000"
          for name in ("debug.xcconfig", "release.xcconfig"):
              path = Path("TWAQI/Config") / name
              lines = path.read_text().splitlines()
              out, replaced = [], False
              for line in lines:
                  if line.strip().startswith("GMSServicesApiKey"):
                      out.append(key_line)
                      replaced = True
                  else:
                      out.append(line)
              if not replaced:
                  out.append(key_line)
              path.write_text("\n".join(out) + "\n")
          PY
          cat > TWAQI/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <!-- 39 chars, starts with A, not an AIza key. Firebase Installations
                 rejects anything else and crashes the test host at launch. -->
            <string>AciPlaceholderKeyForUnitTests0000000000</string>
            <key>GCM_SENDER_ID</key>
            <string>123456789012</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.kfpun.twaqi</string>
            <key>PROJECT_ID</key>
            <string>ci-placeholder</string>
            <key>STORAGE_BUCKET</key>
            <string>ci-placeholder.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:123456789012:ios:abcdefabcdefabcdefabcdef</string>
          </dict>
          </plist>
          EOF

      - name: Install CocoaPods dependencies
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods -N
          fi
          pod install

      - name: Run unit tests
        if: steps.scope.outputs.run == 'true'
        run: |
          set -euo pipefail
          # generic/platform=iOS Simulator cannot execute tests. Pick an
          # installed iPhone simulator instead of pinning a model name.
          device="$(
            xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          names = []
          for runtime, devices in data.get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  name = device.get("name", "")
                  if device.get("isAvailable") and name.startswith("iPhone"):
                      names.append(name)
          plain = [name for name in names if len(name.split()) == 2]
          pool = plain or names
          if not pool:
              sys.exit("No available iPhone simulator")
          def model(name):
              try:
                  return int(name.split()[1])
              except (IndexError, ValueError):
                  return -1
          print(sorted(pool, key=model)[-1])
          '
          )"
          echo "Using iOS Simulator: ${device}"
          # A small, high-signal subset: the suites guarding crash- and
          # regression-prone code. The full TWAQITests suite runs locally
          # (Mac mini / Orca) before merge — see README "Tests".
          #   offline cache + networking: PollutantCacheTests, OfflineCacheRetentionTests
          #   push dual-write, favourites ↔ alerts: PushServiceTests, FavouriteAlertsTests
          #   station-cam history loader/cache: StationCamTests,
          #     StationCamFrameCacheTests, StationCamHistoryCacheTests
          #   SettingsStore persistence: AppLanguageTests
          xcodebuild test \
            -workspace TWAQI.xcworkspace \
            -scheme TWAQI \
            -destination "platform=iOS Simulator,name=${device},OS=latest" \
            -only-testing:TWAQITests/PollutantCacheTests \
            -only-testing:TWAQITests/OfflineCacheRetentionTests \
            -only-testing:TWAQITests/PushServiceTests \
            -only-testing:TWAQITests/FavouriteAlertsTests \
            -only-testing:TWAQITests/StationCamTests \
            -only-testing:TWAQITests/StationCamFrameCacheTests \
            -only-testing:TWAQITests/StationCamHistoryCacheTests \
            -only-testing:TWAQITests/AppLanguageTests \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

  vulnerability-checks:
    name: Vulnerability checks
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'feature/') &&
      github.base_ref == 'master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          version=v2.7.0
          case "$(uname -m)" in
            x86_64)
              asset=osv-scanner_linux_amd64
              sum=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
              ;;
            aarch64)
              asset=osv-scanner_linux_arm64
              sum=4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${version}/${asset}"
          echo "${sum}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner

      - name: Scan and comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        # Warning only: never fail the pull request for scan findings or tool issues.
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          secrets_json="$RUNNER_TEMP/trufflehog.json"
          secrets_err="$RUNNER_TEMP/trufflehog.err"
          deps_log="$RUNNER_TEMP/osv.txt"
          : >"$secrets_json"
          : >"$secrets_err"
          : >"$deps_log"
          echo 1 >"$RUNNER_TEMP/trufflehog.exit"
          echo 1 >"$RUNNER_TEMP/osv.exit"

          # Prefer a binary TruffleHog so the job does not depend on docker.
          # Fall back to docker when the binary install fails; either way a
          # missing tool becomes a warning, not a red check.
          install_trufflehog() {
            version=3.99.7
            case "$(uname -m)" in
              x86_64) arch=amd64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "Unsupported arch for TruffleHog: $(uname -m)" >&2; return 1 ;;
            esac
            url="https://github.com/trufflesecurity/trufflehog/releases/download/v${version}/trufflehog_${version}_linux_${arch}.tar.gz"
            curl -sSfL "$url" -o "$RUNNER_TEMP/trufflehog.tgz" || return 1
            tar -xzf "$RUNNER_TEMP/trufflehog.tgz" -C "$RUNNER_TEMP" trufflehog || return 1
            chmod +x "$RUNNER_TEMP/trufflehog"
            return 0
          }

          if install_trufflehog; then
            "$RUNNER_TEMP/trufflehog" git file://"$PWD" \
              --since-commit "$BASE_SHA" \
              --branch "$HEAD_SHA" \
              --no-update \
              --json >"$secrets_json" 2>"$secrets_err"
            echo $? >"$RUNNER_TEMP/trufflehog.exit"
          elif command -v docker >/dev/null 2>&1; then
            # GHCR tags have no v prefix. Omit --fail so findings do not fail
            # the step. JSON stays in a file so raw secrets are not echoed.
            docker run --rm -v "$PWD:/tmp" -w /tmp \
              ghcr.io/trufflesecurity/trufflehog:3.99.7 \
              git file:///tmp/ \
              --since-commit "$BASE_SHA" \
              --branch "$HEAD_SHA" \
              --no-update \
              --json >"$secrets_json" 2>"$secrets_err"
            echo $? >"$RUNNER_TEMP/trufflehog.exit"
          else
            echo "TruffleHog binary install failed and docker is unavailable." >"$secrets_err"
            echo 127 >"$RUNNER_TEMP/trufflehog.exit"
          fi

          osv-scanner scan source \
            --lockfile=Podfile.lock \
            --lockfile=TWAQI.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            >"$deps_log" 2>&1
          echo $? >"$RUNNER_TEMP/osv.exit"

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.request

          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          marker = "<!-- vulnerability-checks -->"
          secrets_exit = int((runner / "trufflehog.exit").read_text().strip() or "1")
          deps_exit = int((runner / "osv.exit").read_text().strip() or "1")
          secrets_err = (runner / "trufflehog.err").read_text(errors="replace")[-2000:]
          deps_text = (runner / "osv.txt").read_text(errors="replace")
          findings = []
          parse_errors = 0
          for line in (runner / "trufflehog.json").read_text(errors="replace").splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  parse_errors += 1
                  continue
              data = item.get("SourceMetadata", {}).get("Data", {})
              git = data.get("Git") or {}
              filesystem = data.get("Filesystem") or {}
              findings.append({
                  "detector": str(item.get("DetectorName") or "unknown"),
                  "verified": "yes" if item.get("Verified") else "no",
                  "file": str(git.get("file") or filesystem.get("file") or "(unknown file)"),
                  "line": git.get("line") or filesystem.get("line") or "",
                  "commit": str(git.get("commit") or "")[:7],
              })

          def cell(value):
              return str(value).replace("|", "\\|").replace("\n", " ")

          lines = [
              marker,
              "## Vulnerability checks",
              "",
              "Warning only. These results do not fail the pull request.",
              "",
              "### Secrets",
              "",
          ]
          warnings = []
          if secrets_exit != 0:
              lines.append(f"TruffleHog did not finish (exit {secrets_exit}).")
              lines.append("")
              lines.append("```")
              lines.append(secrets_err.strip() or "(no error output)")
              lines.append("```")
              warnings.append(f"TruffleHog did not finish (exit {secrets_exit}). See the pull request comment.")
          elif not findings:
              lines.append("No secrets found between the base and head commits.")
          else:
              shown = findings[:30]
              lines.append("| Detector | Verified | File | Line | Commit |")
              lines.append("| --- | --- | --- | --- | --- |")
              for item in shown:
                  lines.append("| {detector} | {verified} | {file} | {line} | {commit} |".format(
                      detector=cell(item["detector"]),
                      verified=cell(item["verified"]),
                      file=cell(item["file"]),
                      line=cell(item["line"]),
                      commit=cell(item["commit"]),
                  ))
              if len(findings) > len(shown):
                  lines.append("")
                  lines.append(f"{len(findings) - len(shown)} more findings omitted.")
              lines.append("")
              lines.append("Secret values are left out of this comment.")
              warnings.append(
                  f"TruffleHog reported {len(findings)} secret finding(s). Details are in the pull request comment."
              )
          if parse_errors:
              lines.append("")
              lines.append(f"{parse_errors} secret-scan lines were not JSON and were skipped.")

          lines.extend(["", "### Dependencies", ""])
          if deps_exit not in (0, 1):
              lines.append(f"osv-scanner did not finish (exit {deps_exit}).")
              lines.append("")
              lines.append("```")
              lines.append(deps_text.strip()[:12000] or "(no output)")
              lines.append("```")
              warnings.append(f"osv-scanner did not finish (exit {deps_exit}). See the pull request comment.")
          elif deps_exit == 0:
              lines.append("No known vulnerable dependencies in `Podfile.lock` or `Package.resolved`.")
              if deps_text.strip():
                  lines.append("")
                  lines.append("```")
                  lines.append(deps_text.strip()[:4000])
                  lines.append("```")
          else:
              lines.append("Known vulnerable dependencies:")
              lines.append("")
              lines.append("```")
              lines.append(deps_text.strip()[:12000] or "(no output)")
              lines.append("```")
              warnings.append("osv-scanner found known vulnerable dependencies. Details are in the pull request comment.")

          body = "\n".join(lines) + "\n"
          if len(body) > 60000:
              body = body[:60000] + "\n\n(truncated)\n"
          comment_path = runner / "vuln-comment.md"
          comment_path.write_text(body)
          for message in warnings:
              print(f"::warning::{message.replace(chr(10), ' ')}", flush=True)
          if not warnings:
              print("Vulnerability checks reported nothing to warn about.", flush=True)

          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""

          def api(method, endpoint, payload=None):
              url = f"https://api.github.com/{endpoint}"
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          listed = []
          try:
              # Prefer gh when present; fall back to curl-equivalent urllib.
              if subprocess.call(["bash", "-lc", "command -v gh >/dev/null"]) == 0:
                  listed = subprocess.check_output([
                      "gh", "api", "--paginate",
                      f"repos/{repo}/issues/{pr}/comments",
                      "--jq", f'.[] | select(.body | startswith("{marker}")) | .id',
                  ], text=True).split()
                  payload = runner / "vuln-comment.json"
                  payload.write_text(json.dumps({"body": body}))
                  if listed:
                      endpoint = f"repos/{repo}/issues/comments/{listed[-1]}"
                      method = "PATCH"
                  else:
                      endpoint = f"repos/{repo}/issues/{pr}/comments"
                      method = "POST"
                  subprocess.check_call(["gh", "api", "--method", method, endpoint, "--input", str(payload)])
              else:
                  page = 1
                  while True:
                      batch = api("GET", f"repos/{repo}/issues/{pr}/comments?per_page=100&page={page}")
                      if not batch:
                          break
                      for item in batch:
                          if str(item.get("body") or "").startswith(marker):
                              listed.append(str(item["id"]))
                      if len(batch) < 100:
                          break
                      page += 1
                  if listed:
                      api("PATCH", f"repos/{repo}/issues/comments/{listed[-1]}", {"body": body})
                  else:
                      api("POST", f"repos/{repo}/issues/{pr}/comments", {"body": body})
          except Exception as exc:
              print(f"::warning::Could not post vulnerability comment: {exc}", flush=True)
          PY
          # Always green: findings and tool failures are warnings/comments only.
          exit 0
