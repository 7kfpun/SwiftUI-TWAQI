name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

# Draftness is part of the key. A push and "Ready for review" in the same second
# give a run whose payload still says draft (it skips every job) and the real
# non-draft run. With one key per PR, the stale draft run could cancel the real
# one and the PR showed CI as skipped. Now a run only cancels runs of the same
# draftness, so marking a PR ready always gets a full run (FOX-38).
concurrency:
  group: ci-${{ github.event.pull_request.number }}-draft-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides the level on a cheap Linux runner, so a PR that needs no iOS build
  # never starts a macOS runner (FOX-143). At the skip level `Unit tests` below
  # shows as skipped, which GitHub counts as passing for a required check.
  scope:
    name: Unit tests scope
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'feature/') &&
      github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      level: ${{ steps.scope.outputs.level }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The level decision's own tests, and the two lists in the `Unit tests`
      # job's env against this checkout. Seconds, before anything is built.
      - name: Check the test-level lists
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools -p 'test_ci_test_level.py'
          python3 tools/ci_test_level.py check

      # skip: nothing more runs and the check is green. build: build-for-testing
      # only, no simulator. test: build, boot and run the subset.
      # tools/ci_test_level.py has the rules; the README "Tests" has the table.
      - name: Decide the test level
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Shallow checkout does not contain the base commit, so use the pull
          # request file list. Labels are read live, so re-running the job after
          # adding ci-full-tests picks it up. An empty list or an API error
          # gives the test level: never skip on doubt.
          files="$RUNNER_TEMP/pr-files.txt"
          labels="$RUNNER_TEMP/pr-labels.txt"
          api_error=""
          if ! gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename' > "$files"; then
            echo "::warning::Could not list the pull request's files. Running the unit tests."
            api_error="--api-error"
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.labels[].name' > "$labels"; then
            echo "::warning::Could not read the pull request's labels. Running the unit tests."
            api_error="--api-error"
          fi
          # shellcheck disable=SC2086 # api_error is empty or one flag
          python3 tools/ci_test_level.py decide --files "$files" --labels "$labels" $api_error

  tests:
    name: Unit tests
    needs: scope
    # Runs at the build and test levels. `!cancelled()` and the scope result
    # check: if `Unit tests scope` fails (say the lists drifted), this job still
    # runs and fails at its first step instead of being skipped, because a
    # skipped required check would count as passing.
    if: >-
      !cancelled() &&
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'feature/') &&
      github.base_ref == 'master' &&
      (needs.scope.result != 'success' || needs.scope.outputs.level != 'skip')
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      COCOAPODS_DISABLE_STATS: "true"
      # The CI subset: a small, high-signal set of TWAQITests suites guarding
      # crash- and regression-prone code. The full suite runs locally (Mac mini /
      # Orca) before merge, see README "Tests".
      #   offline cache + networking: PollutantCacheTests, OfflineCacheRetentionTests
      #   push dual-write, favourites ↔ alerts: PushServiceTests, FavouriteAlertsTests
      #   station-cam history loader/cache: StationCamTests,
      #     StationCamFrameCacheTests, StationCamHistoryCacheTests
      #   SettingsStore persistence: AppLanguageTests
      #   Directus create-only forms: FeedbackServiceTests, CooperateServiceTests
      CI_TEST_SUITES: |
        PollutantCacheTests
        OfflineCacheRetentionTests
        PushServiceTests
        FavouriteAlertsTests
        StationCamTests
        StationCamFrameCacheTests
        StationCamHistoryCacheTests
        AppLanguageTests
        FeedbackServiceTests
        CooperateServiceTests
        WidgetExtraLargeTests
      # Keep in step with CI_TEST_SUITES (FOX-79): the suites' test files and the
      # source files they test. A PR touching one of these runs the subset; any
      # other app change only builds. Adding a suite means adding its test file
      # and its subject files here. tools/ci_test_level.py check (the "Check the
      # test-level lists" step) fails when a suite's file is missing here or an
      # entry matches no file. `*` stays in one folder, `**/` spans folders.
      CI_GUARDED_PATHS: |
        # Test files of the subset suites
        ios/TWAQITests/PollutantCacheTests.swift
        ios/TWAQITests/OfflineCacheRetentionTests.swift
        ios/TWAQITests/PushServiceTests.swift
        ios/TWAQITests/StationCamTests.swift
        ios/TWAQITests/AppLanguageTests.swift
        ios/TWAQITests/FeedbackServiceTests.swift
        ios/TWAQITests/CooperateServiceTests.swift
        ios/TWAQITests/WidgetExtraLargeTests.swift
        # Offline caches (PollutantCacheTests, OfflineCacheRetentionTests,
        # WidgetExtraLargeTests for the widget's station detail cache; the watch's
        # reading expiry is checked against the same ceiling)
        ios/TWAQI/Utils/PollutantCache.swift
        ios/TWAQI/Utils/WidgetStationDetail.swift
        ios/TWAQI/Utils/OfflineCacheRetention.swift
        ios/TWAQIWatch/Shared/WatchStore.swift
        ios/TWAQIWatch/Shared/WatchReading.swift
        # Push dual-write (PushServiceTests): OneSignalTags and PushDeviceIdentity
        # live in DirectusPushMirror.swift
        ios/TWAQI/Utils/PushService.swift
        ios/TWAQI/Utils/DirectusPushMirror.swift
        ios/TWAQI/Models/StationAlertSetting.swift
        # Favourites ↔ alerts (FavouriteAlertsTests)
        ios/TWAQI/Utils/FavouriteAlerts.swift
        # Station-cam history (StationCam*Tests): models and matcher, frame and hour
        # caches, StationCamHistoryLoader in StationCamView.swift, StationCamStore
        ios/TWAQI/**/StationCam*.swift
        # SettingsStore (AppLanguageTests): AppLanguage and Locale.app in
        # LocaleExtension.swift, String.localized, on-device translation,
        # Pollutant.displayLocality
        ios/TWAQI/Utils/SettingsStore.swift
        ios/TWAQI/Utils/LocaleExtension.swift
        ios/TWAQI/Utils/StringExtension.swift
        ios/TWAQI/Utils/OnDeviceTranslation.swift
        ios/TWAQI/Models/Pollutants.swift
        # Directus create-only forms (FeedbackServiceTests, CooperateServiceTests)
        ios/TWAQI/Utils/FeedbackService.swift
        ios/TWAQI/Utils/CooperateService.swift
    steps:
      - name: Stop if the level could not be decided
        if: needs.scope.result != 'success'
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
        run: |
          echo "::error::Unit tests scope did not succeed ($SCOPE_RESULT); see that job."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare gitignored config
        run: |
          set -euo pipefail
          # The project will not build without these, and they are gitignored
          # because they hold local API keys. Example values are enough to
          # compile and launch the host app for unit tests.
          cp ios/TWAQI/Config/example.xcconfig ios/TWAQI/Config/debug.xcconfig
          cp ios/TWAQI/Config/example.xcconfig ios/TWAQI/Config/release.xcconfig
          # example.xcconfig sets GMSServicesApiKey to an empty value
          # (`= // Required` is a comment). An empty key skips meaningful
          # GMSServices.provideAPIKey, and creating GMSMapView then crashes
          # the test host with GMSServicesException.
          python3 - <<'PY'
          from pathlib import Path
          key_line = "GMSServicesApiKey = AIzaSyCIPlaceholderKeyForUnitTests000"
          for name in ("debug.xcconfig", "release.xcconfig"):
              path = Path("ios/TWAQI/Config") / name
              lines = path.read_text().splitlines()
              out, replaced = [], False
              for line in lines:
                  if line.strip().startswith("GMSServicesApiKey"):
                      out.append(key_line)
                      replaced = True
                  else:
                      out.append(line)
              if not replaced:
                  out.append(key_line)
              path.write_text("\n".join(out) + "\n")
          PY
          cat > ios/TWAQI/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <!-- 39 chars, starts with A, not an AIza key. Firebase Installations
                 rejects anything else and crashes the test host at launch. -->
            <string>AciPlaceholderKeyForUnitTests0000000000</string>
            <key>GCM_SENDER_ID</key>
            <string>123456789012</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.kfpun.twaqi</string>
            <key>PROJECT_ID</key>
            <string>ci-placeholder</string>
            <key>STORAGE_BUCKET</key>
            <string>ci-placeholder.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false/>
            <key>IS_ANALYTICS_ENABLED</key>
            <false/>
            <key>IS_APPINVITE_ENABLED</key>
            <true/>
            <key>IS_GCM_ENABLED</key>
            <true/>
            <key>IS_SIGNIN_ENABLED</key>
            <true/>
            <key>GOOGLE_APP_ID</key>
            <string>1:123456789012:ios:abcdefabcdefabcdefabcdef</string>
          </dict>
          </plist>
          EOF

      - name: Pick simulator
        if: needs.scope.outputs.level == 'test'
        run: |
          set -euo pipefail
          # The first simctl call on a runner can take a minute (it starts
          # CoreSimulatorService). Pick in the background, overlapping the build.
          state="$RUNNER_TEMP/simulator"
          mkdir -p "$state"
          # generic/platform=iOS Simulator cannot execute tests. Pick the newest
          # iOS runtime, and on it the highest-numbered plain iPhone ("iPhone 17"
          # over "iPhone 17 Pro"), instead of pinning a model name.
          cat > "$state/pick.py" <<'PY'
          import json, re, sys
          data = json.load(sys.stdin)
          best = None
          for runtime, devices in data.get("devices", {}).items():
              match = re.search(r"SimRuntime\.iOS-([0-9-]+)$", runtime)
              if not match:
                  continue
              version = tuple(int(part) for part in match.group(1).split("-"))
              phones = [d for d in devices if d.get("isAvailable") and d.get("name", "").startswith("iPhone")]
              if not phones:
                  continue
              plain = [d for d in phones if len(d["name"].split()) == 2] or phones
              def model(device):
                  try:
                      return int(device["name"].split()[1])
                  except (IndexError, ValueError):
                      return -1
              device = sorted(plain, key=model)[-1]
              if best is None or version > best[0]:
                  best = (version, device)
          if best is None:
              sys.exit("No available iPhone simulator")
          version, device = best
          print(device["udid"], device["name"], "iOS " + ".".join(map(str, version)), sep="\t")
          PY
          cat > "$state/pick.sh" <<'SH'
          set -euo pipefail
          state="$1"
          trap 'echo $? > "$state/exit"' EXIT
          echo "$(date -u +%T) picking"
          xcrun simctl list devices available -j > "$state/devices.json"
          python3 "$state/pick.py" < "$state/devices.json" > "$state/picked.tmp"
          mv "$state/picked.tmp" "$state/picked"
          echo "$(date -u +%T) picked $(tr '\t' ' ' < "$state/picked")"
          SH
          nohup bash "$state/pick.sh" "$state" > "$state/pick.log" 2>&1 &
          echo "Picking a simulator in the background (log: $state/pick.log)."

      # The three caches (restored, saved only on a miss), pod install
      # and build-for-testing. Shared with ci-cache.yml, which fills the same
      # keys from master so a PR's first run starts warm (FOX-65).
      - name: Restore caches and build for testing
        uses: ./.github/actions/unit-tests-build

      - name: Boot simulator
        id: boot
        if: needs.scope.outputs.level == 'test'
        run: |
          set -euo pipefail
          # Booted after the build, not during it. On slow runners a first boot
          # (data migration) and the build slowed each other down several
          # times over: a 532 s boot and a 305 s compile in one run, against
          # 50 s and 43 s on a fast runner. In sequence each runs at full speed.
          state="$RUNNER_TEMP/simulator"
          for _ in $(seq 1 300); do
            if [ -s "$state/exit" ]; then break; fi
            sleep 1
          done
          cat "$state/pick.log" || true
          if [ ! -s "$state/picked" ]; then
            echo "::error::No iPhone simulator was picked. See the log above."
            exit 1
          fi
          udid="$(cut -f1 "$state/picked")"
          echo "udid=${udid}" >> "$GITHUB_OUTPUT"
          echo "Booting iOS Simulator: $(tr '\t' ' ' < "$state/picked")"
          # bootstatus -b boots the device and waits until it is ready.
          xcrun simctl bootstatus "$udid" -b

      - name: Run unit tests
        if: needs.scope.outputs.level == 'test'
        env:
          UDID: ${{ steps.boot.outputs.udid }}
        run: |
          set -euo pipefail
          xctestrun="$(find "${RUNNER_TEMP}/DerivedData/Build/Products" -maxdepth 1 -name 'TWAQI-CI_*.xctestrun' | head -n 1)"
          if [ -z "$xctestrun" ]; then
            echo "::error::Build for testing produced no TWAQI-CI .xctestrun file."
            exit 1
          fi
          # The subset is CI_TEST_SUITES in the job's env (with CI_GUARDED_PATHS).
          only=()
          while IFS= read -r suite; do
            suite="${suite//[[:space:]]/}"
            case "$suite" in ""|"#"*) continue ;; esac
            only+=("-only-testing:TWAQITests/${suite}")
          done <<< "$CI_TEST_SUITES"
          if [ "${#only[@]}" -eq 0 ]; then
            echo "::error::CI_TEST_SUITES is empty."
            exit 1
          fi
          printf 'Running %s\n' "${only[@]}"
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "id=${UDID}" \
            "${only[@]}" \
            -derivedDataPath "${RUNNER_TEMP}/DerivedData"

  vulnerability-checks:
    name: Vulnerability checks
    if: >-
      github.event.pull_request.draft == false &&
      startsWith(github.head_ref, 'feature/') &&
      github.base_ref == 'master'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install osv-scanner
        run: |
          set -euo pipefail
          version=v2.7.0
          case "$(uname -m)" in
            x86_64)
              asset=osv-scanner_linux_amd64
              sum=160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
              ;;
            aarch64)
              asset=osv-scanner_linux_arm64
              sum=4061ef4c021ed3c47f203b818f337e351336cc5cd67c0274fc36bd1dfc728dd7
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/${version}/${asset}"
          echo "${sum}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          sudo mv osv-scanner /usr/local/bin/osv-scanner

      - name: Scan and comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        # Reports only: findings and tool issues never fail this step. The next
        # step fails the job on verified secrets alone (FOX-38).
        continue-on-error: true
        run: |
          set +e
          set -uo pipefail
          secrets_json="$RUNNER_TEMP/trufflehog.json"
          secrets_err="$RUNNER_TEMP/trufflehog.err"
          deps_log="$RUNNER_TEMP/osv.txt"
          : >"$secrets_json"
          : >"$secrets_err"
          : >"$deps_log"
          echo 1 >"$RUNNER_TEMP/trufflehog.exit"
          echo 1 >"$RUNNER_TEMP/osv.exit"
          rm -f "$RUNNER_TEMP/trufflehog.verified"

          # Prefer a binary TruffleHog so the job does not depend on docker.
          # Fall back to docker when the binary install fails; either way a
          # missing tool becomes a warning, not a red check.
          install_trufflehog() {
            version=3.99.7
            case "$(uname -m)" in
              x86_64) arch=amd64 ;;
              aarch64|arm64) arch=arm64 ;;
              *) echo "Unsupported arch for TruffleHog: $(uname -m)" >&2; return 1 ;;
            esac
            url="https://github.com/trufflesecurity/trufflehog/releases/download/v${version}/trufflehog_${version}_linux_${arch}.tar.gz"
            curl -sSfL "$url" -o "$RUNNER_TEMP/trufflehog.tgz" || return 1
            tar -xzf "$RUNNER_TEMP/trufflehog.tgz" -C "$RUNNER_TEMP" trufflehog || return 1
            chmod +x "$RUNNER_TEMP/trufflehog"
            return 0
          }

          if install_trufflehog; then
            "$RUNNER_TEMP/trufflehog" git file://"$PWD" \
              --since-commit "$BASE_SHA" \
              --branch "$HEAD_SHA" \
              --no-update \
              --json >"$secrets_json" 2>"$secrets_err"
            echo $? >"$RUNNER_TEMP/trufflehog.exit"
          elif command -v docker >/dev/null 2>&1; then
            # GHCR tags have no v prefix. Omit --fail so findings do not fail
            # the step. JSON stays in a file so raw secrets are not echoed.
            docker run --rm -v "$PWD:/tmp" -w /tmp \
              ghcr.io/trufflesecurity/trufflehog:3.99.7 \
              git file:///tmp/ \
              --since-commit "$BASE_SHA" \
              --branch "$HEAD_SHA" \
              --no-update \
              --json >"$secrets_json" 2>"$secrets_err"
            echo $? >"$RUNNER_TEMP/trufflehog.exit"
          else
            echo "TruffleHog binary install failed and docker is unavailable." >"$secrets_err"
            echo 127 >"$RUNNER_TEMP/trufflehog.exit"
          fi

          osv-scanner scan source \
            --lockfile=ios/Podfile.lock \
            --lockfile=ios/TWAQI.xcworkspace/xcshareddata/swiftpm/Package.resolved \
            >"$deps_log" 2>&1
          echo $? >"$RUNNER_TEMP/osv.exit"

          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import urllib.error
          import urllib.request

          runner = pathlib.Path(os.environ["RUNNER_TEMP"])
          marker = "<!-- vulnerability-checks -->"
          secrets_exit = int((runner / "trufflehog.exit").read_text().strip() or "1")
          deps_exit = int((runner / "osv.exit").read_text().strip() or "1")
          secrets_err = (runner / "trufflehog.err").read_text(errors="replace")[-2000:]
          deps_text = (runner / "osv.txt").read_text(errors="replace")
          findings = []
          parse_errors = 0
          for line in (runner / "trufflehog.json").read_text(errors="replace").splitlines():
              line = line.strip()
              if not line:
                  continue
              try:
                  item = json.loads(line)
              except json.JSONDecodeError:
                  parse_errors += 1
                  continue
              data = item.get("SourceMetadata", {}).get("Data", {})
              git = data.get("Git") or {}
              filesystem = data.get("Filesystem") or {}
              findings.append({
                  "detector": str(item.get("DetectorName") or "unknown"),
                  "verified": "yes" if item.get("Verified") else "no",
                  "file": str(git.get("file") or filesystem.get("file") or "(unknown file)"),
                  "line": git.get("line") or filesystem.get("line") or "",
                  "commit": str(git.get("commit") or "")[:7],
              })

          def cell(value):
              return str(value).replace("|", "\\|").replace("\n", " ")

          verified = [item for item in findings if item["verified"] == "yes"]
          if secrets_exit == 0:
              # Read by the "Fail on verified secrets" step. Not written when
              # TruffleHog did not finish, which stays a warning.
              (runner / "trufflehog.verified").write_text(f"{len(verified)}\n")

          lines = [
              marker,
              "## Vulnerability checks",
              "",
              "**Verified** secrets (TruffleHog confirmed the credential is live) fail this check.",
              "Unverified secret findings and dependency results are warnings only.",
              "",
              "### Secrets",
              "",
          ]
          warnings = []
          if secrets_exit != 0:
              lines.append(f"TruffleHog did not finish (exit {secrets_exit}).")
              lines.append("")
              lines.append("```")
              lines.append(secrets_err.strip() or "(no error output)")
              lines.append("```")
              warnings.append(f"TruffleHog did not finish (exit {secrets_exit}). See the pull request comment.")
          elif not findings:
              lines.append("No secrets found between the base and head commits.")
          else:
              shown = findings[:30]
              lines.append("| Detector | Verified | File | Line | Commit |")
              lines.append("| --- | --- | --- | --- | --- |")
              for item in shown:
                  lines.append("| {detector} | {verified} | {file} | {line} | {commit} |".format(
                      detector=cell(item["detector"]),
                      verified=cell(item["verified"]),
                      file=cell(item["file"]),
                      line=cell(item["line"]),
                      commit=cell(item["commit"]),
                  ))
              if len(findings) > len(shown):
                  lines.append("")
                  lines.append(f"{len(findings) - len(shown)} more findings omitted.")
              lines.append("")
              lines.append("Secret values are left out of this comment.")
              if verified:
                  lines.append("")
                  lines.append(
                      f"**{len(verified)} verified secret(s): this check fails.** Revoke and rotate the "
                      "credential, then remove it from the branch's commits. The repository is public, "
                      "so a pushed secret is already exposed."
                  )
              warnings.append(
                  f"TruffleHog reported {len(findings)} secret finding(s). Details are in the pull request comment."
              )
          if parse_errors:
              lines.append("")
              lines.append(f"{parse_errors} secret-scan lines were not JSON and were skipped.")

          lines.extend(["", "### Dependencies", ""])
          if deps_exit not in (0, 1):
              lines.append(f"osv-scanner did not finish (exit {deps_exit}).")
              lines.append("")
              lines.append("```")
              lines.append(deps_text.strip()[:12000] or "(no output)")
              lines.append("```")
              warnings.append(f"osv-scanner did not finish (exit {deps_exit}). See the pull request comment.")
          elif deps_exit == 0:
              lines.append("No known vulnerable dependencies in `Podfile.lock` or `Package.resolved`.")
              if deps_text.strip():
                  lines.append("")
                  lines.append("```")
                  lines.append(deps_text.strip()[:4000])
                  lines.append("```")
          else:
              lines.append("Known vulnerable dependencies:")
              lines.append("")
              lines.append("```")
              lines.append(deps_text.strip()[:12000] or "(no output)")
              lines.append("```")
              warnings.append("osv-scanner found known vulnerable dependencies. Details are in the pull request comment.")

          body = "\n".join(lines) + "\n"
          if len(body) > 60000:
              body = body[:60000] + "\n\n(truncated)\n"
          comment_path = runner / "vuln-comment.md"
          comment_path.write_text(body)
          for message in warnings:
              print(f"::warning::{message.replace(chr(10), ' ')}", flush=True)
          if not warnings:
              print("Vulnerability checks reported nothing to warn about.", flush=True)

          repo = os.environ["GITHUB_REPOSITORY"]
          pr = os.environ["PR_NUMBER"]
          token = os.environ.get("GH_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""

          def api(method, endpoint, payload=None):
              url = f"https://api.github.com/{endpoint}"
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              if data is not None:
                  req.add_header("Content-Type", "application/json")
              with urllib.request.urlopen(req) as resp:
                  return json.load(resp)

          listed = []
          try:
              # Prefer gh when present; fall back to curl-equivalent urllib.
              if subprocess.call(["bash", "-lc", "command -v gh >/dev/null"]) == 0:
                  listed = subprocess.check_output([
                      "gh", "api", "--paginate",
                      f"repos/{repo}/issues/{pr}/comments",
                      "--jq", f'.[] | select(.body | startswith("{marker}")) | .id',
                  ], text=True).split()
                  payload = runner / "vuln-comment.json"
                  payload.write_text(json.dumps({"body": body}))
                  if listed:
                      endpoint = f"repos/{repo}/issues/comments/{listed[-1]}"
                      method = "PATCH"
                  else:
                      endpoint = f"repos/{repo}/issues/{pr}/comments"
                      method = "POST"
                  subprocess.check_call(["gh", "api", "--method", method, endpoint, "--input", str(payload)])
              else:
                  page = 1
                  while True:
                      batch = api("GET", f"repos/{repo}/issues/{pr}/comments?per_page=100&page={page}")
                      if not batch:
                          break
                      for item in batch:
                          if str(item.get("body") or "").startswith(marker):
                              listed.append(str(item["id"]))
                      if len(batch) < 100:
                          break
                      page += 1
                  if listed:
                      api("PATCH", f"repos/{repo}/issues/comments/{listed[-1]}", {"body": body})
                  else:
                      api("POST", f"repos/{repo}/issues/{pr}/comments", {"body": body})
          except Exception as exc:
              print(f"::warning::Could not post vulnerability comment: {exc}", flush=True)
          PY
          # Always green: the next step decides whether the job fails.
          exit 0

      - name: Fail on verified secrets
        run: |
          set -euo pipefail
          count_file="$RUNNER_TEMP/trufflehog.verified"
          if [ ! -s "$count_file" ]; then
            # TruffleHog did not finish; already reported as a warning.
            echo "::warning::No TruffleHog result to check; verified secrets were not ruled out."
            exit 0
          fi
          count="$(tr -dc '0-9' <"$count_file")"
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::TruffleHog verified ${count} live secret(s) in this pull request's commits. See the Vulnerability checks comment; rotate them and remove them from the branch."
            exit 1
          fi
          echo "No verified secrets."
