name: LGTM

# Turns a reviewer's LGTM into a commit status that branch protection can
# require. PRs are opened from the owner's account, which can't APPROVE its own
# PR. A pull request review or comment whose first line is "<Name> LGTM" (any
# reviewer name, or none) covers the head; a later "changes needed" cancels it.
# The job sets the `LGTM` status: pending until an LGTM covers the head's
# changes. See tools/lgtm_gate.py and docs/master-protection.md.
#
# Its own job always succeeds; what protection requires is the status.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, feature/fox-52-android-project-setup]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

concurrency:
  group: lgtm-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: LGTM gate
    # issue_comment events don't carry the base ref; the script skips other bases.
    if: ${{ (github.event_name == 'issue_comment' && github.event.issue.pull_request) || (github.event_name != 'issue_comment' && (github.event.pull_request.base.ref == 'master' || github.event.pull_request.base.ref == 'feature/fox-52-android-project-setup')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set the LGTM status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref || 'master' }}
        run: |
          set -euo pipefail
          # The base branch's copy when there is one (master's for comments), so a
          # PR can't rewrite its own gate.
          script="$RUNNER_TEMP/lgtm_gate.py"
          git show "origin/$BASE_REF:tools/lgtm_gate.py" >"$script" 2>/dev/null || cp tools/lgtm_gate.py "$script"
          python3 "$script"
