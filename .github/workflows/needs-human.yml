name: Needs your eyes

# Keeps the human queue short and specific (FOX-179). A non-draft PR labelled
# merge-risk:high, no-auto-merge or needs-human gets ONE sticky comment headed
# "Needs your eyes" (read time, risky paths, the reviewer's "Human check:" bullets);
# it is edited in place and removed when the labels go, the PR is drafted or closed.
# A second job keeps one issue with a line per waiting PR.
#
# pull_request_target so labels work on every PR, but nothing from the PR is checked
# out or run: the job checks out the default branch and runs master's tools/needs_human.py.
# Built-in token only, no secrets.

on:
  pull_request_target:
    types: [opened, reopened, labeled, unlabeled, synchronize, ready_for_review, converted_to_draft, closed]
    branches: [master]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sticky:
    name: Needs your eyes comment
    if: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.login != 'github-actions[bot]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: needs-human-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout the default branch (never the PR)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Unit tests
        run: |
          # Until this workflow's own PR merges, master has no script: nothing to do.
          [ -f tools/needs_human.py ] || { echo "tools/needs_human.py not on the default branch yet"; exit 0; }
          python3 -m unittest discover -s tools -p 'test_needs_human.py'

      - name: Update the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          [ -f tools/needs_human.py ] || exit 0
          python3 tools/needs_human.py pr

  queue:
    name: Needs your eyes issue
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: needs-human-queue
      cancel-in-progress: true
    steps:
      - name: Checkout the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update the queue issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -f tools/needs_human.py ] || exit 0
          python3 tools/needs_human.py queue
