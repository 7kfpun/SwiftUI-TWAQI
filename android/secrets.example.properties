# App config, the Android side of ios/TWAQI/Config/example.xcconfig.
# Copy to secrets.properties (gitignored) and fill in the real values; any key
# left out of secrets.properties falls back to this file, so a clean checkout
# builds as-is. Never commit real values.

# APIs (iOS: API_DOMAIN)
API_DOMAIN=https://api.example.com

# Google Maps SDK key (iOS: GMSServicesApiKey)
MAPS_API_KEY=placeholder-maps-key

# Directus (iOS: DirectusUrl, DirectusFeedbackToken, DirectusCooperateToken)
DIRECTUS_URL=https://directus.example.com
DIRECTUS_FEEDBACK_TOKEN=
DIRECTUS_COOPERATE_TOKEN=

# The webcam host (iOS StationCam.baseURL): the station cam manifest, the
# latest frames and their hourly history (FOX-92).
STATION_CAMS_URL=https://cams.example.com

# Push alerts (FOX-57; iOS: PushApiUrl): the push Worker's base URL, https only.
# Empty: alerts are kept on the phone and not synced.
PUSH_API_URL=

# AdMob (iOS: GADApplicationIdentifier, AdUnitId*Footer). These are Google's
# public Android test ids, which serve test ads; the real ones come from the
# AdMob Android app.
ADMOB_APP_ID=ca-app-pub-3940256099942544~3347511713
AD_UNIT_ID_MAIN_FOOTER=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_DETAILS_LIST_FOOTER=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_DETAILS_FOOTER=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_FAVOURITES_FOOTER=ca-app-pub-3940256099942544/9214589741
AD_UNIT_ID_HELP_FOOTER=ca-app-pub-3940256099942544/9214589741

# Play upload: path to the Play service-account JSON (gitignored), relative to
# android/ or absolute. Default: play-service-account.json in android/.
PLAY_SERVICE_ACCOUNT_JSON=
