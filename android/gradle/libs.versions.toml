[versions]
# compileSdk is 36 (FOX-51/FOX-52). Compose 1.12+, core 1.19+ and lifecycle 2.11+ need
# compileSdk 37, so these stay on the last releases that build against 36.
agp = "9.5.1"
# AGP's built-in Kotlin uses the Kotlin Gradle plugin this Compose compiler plugin puts on the classpath.
kotlin = "2.4.21"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
appcompat = "1.7.1"
firebaseBom = "35.1.0"
googleServices = "4.5.0"
crashlytics = "3.0.8"
playPublisher = "4.1.1"
ktlintGradle = "14.2.0"
junit = "4.13.2"
okhttp = "4.12.0"
kotlinxSerialization = "1.12.0"
coroutines = "1.11.0"
# Maps Compose and its clustering utils (FOX-54 map, FOX-55 station page). 8.3.1+ needs
# compileSdk 37 (its AAR metadata), so this stays on 8.3.0.
mapsCompose = "8.3.0"
# FOX-58: Pro (Play Billing), the cached entitlement, AdMob and UMP consent.
billing = "9.1.0"
datastore = "1.3.0"
playServicesAds = "25.5.0"
ump = "4.0.0"
# FOX-54: the fold line for the wide map layout.
window = "1.5.0"
# FOX-57: push alerts (alert sync in the background, FCM).
work = "2.10.5"
# FOX-60: the Play In-App Review prompt.
playReview = "2.0.2"
# FOX-59: home screen widgets (Glance, compileSdk 35+); their refresh uses FOX-57's WorkManager.
glance = "1.2.0"
# FOX-98: on-device translation of Chinese-only API text (ML Kit, zh → en, no key).
mlkitTranslate = "17.0.3"
# FOX-62: the Wear OS app (:wear), its complication and tile, and the phone ↔ watch Data Layer.
# Wear Compose 1.7+ needs compileSdk 37, so it stays on 1.6.
wearCompose = "1.6.1"
wearTiles = "1.6.2"
wearProtolayout = "1.4.2"
wearComplications = "1.3.0"
wearRemoteInteractions = "1.1.0"
wearInput = "1.2.0"
playServicesWearable = "19.0.0"
concurrentFutures = "1.3.0"
# The watch asks for location with the Activity Result API, which needs Fragment 1.3+ on the classpath.
fragment = "1.8.9"

