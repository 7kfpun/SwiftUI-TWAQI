[versions]
# compileSdk is 36 (FOX-51/FOX-52). Compose 1.12+, core 1.19+ and lifecycle 2.11+ need
# compileSdk 37, so these stay on the last releases that build against 36.
agp = "9.5.1"
# AGP's built-in Kotlin uses the Kotlin Gradle plugin this Compose compiler plugin puts on the classpath.
kotlin = "2.4.21"
composeBom = "2026.06.01"
activityCompose = "1.12.4"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
appcompat = "1.7.1"
firebaseBom = "35.1.0"
googleServices = "4.5.0"
crashlytics = "3.0.8"
playPublisher = "4.1.1"
ktlintGradle = "14.2.0"
junit = "4.13.2"
okhttp = "4.12.0"
kotlinxSerialization = "1.12.0"
coroutines = "1.11.0"
# Maps Compose and its clustering utils (FOX-54 map, FOX-55 station page). 8.3.1+ needs
# compileSdk 37 (its AAR metadata), so this stays on 8.3.0.
mapsCompose = "8.3.0"
# FOX-58: Pro (Play Billing), the cached entitlement, AdMob and UMP consent.
billing = "9.1.0"
datastore = "1.3.0"
playServicesAds = "25.5.0"
ump = "4.0.0"
# FOX-54: the fold line for the wide map layout.
window = "1.5.0"
# FOX-57: push alerts (alert sync in the background, FCM).
work = "2.10.5"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
play-billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playServicesAds" }
google-ump = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }
maps-compose-utils = { group = "com.google.maps.android", name = "maps-compose-utils", version.ref = "mapsCompose" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
play-publisher = { id = "com.github.triplet.play", version.ref = "playPublisher" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
