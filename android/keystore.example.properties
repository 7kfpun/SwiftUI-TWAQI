# Release signing. Copy to keystore.properties (gitignored) and fill in.
# storeFile is relative to android/ or absolute; keep the keystore itself out
# of the repo (*.jks and *.keystore are gitignored).
storeFile=/path/to/upload-keystore.jks
storePassword=your-store-password
keyAlias=upload
keyPassword=your-key-password
